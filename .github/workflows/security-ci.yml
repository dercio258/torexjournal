name: Torex Security & DevSecOps CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly Monday 03:00 UTC vulnerability & dependency sweep
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-semgrep:
    name: SAST (Semgrep TS / React / Python)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep security rulesets
        run: >
          semgrep scan
          --config p/typescript
          --config p/react
          --config p/python
          --config p/owasp-top-ten
          --exclude node_modules
          --exclude dist
          --exclude build
          --error

  sca-trivy:
    name: Dependency & Filesystem Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

  python-mt5-security:
    name: MT5 Python Worker Security (Bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Bandit and pip-audit
        run: python -m pip install --upgrade pip bandit pip-audit
      - name: Run Bandit SAST on mt5-server
        run: bandit -r mt5-server -ll -ii --exclude mt5-server/venv,mt5-server/.venv
      - name: Run pip-audit on mt5-server requirements
        if: hashFiles('mt5-server/requirements.txt') != ''
        run: pip-audit -r mt5-server/requirements.txt

  backend-security-tests:
    name: Backend TypeCheck, Audit & Security Regression Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend-nest/package-lock.json
      - name: Install backend dependencies
        working-directory: backend-nest
        run: npm ci
      - name: Run npm audit (high/critical)
        working-directory: backend-nest
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: TypeScript typecheck
        working-directory: backend-nest
        run: npx tsc --noEmit
      - name: Run security regression suites (P0–P3 + Auth + Error Sanitizer)
        working-directory: backend-nest
        run: >
          npx jest
          src/common/security/phase1-hardening.spec.ts
          src/common/security/phase2-hardening.spec.ts
          src/common/security/phase3-hardening.spec.ts
          src/common/observability/error-sanitizer.util.spec.ts
          src/auth/registration-security.util.spec.ts
          src/auth/audit-log.service.spec.ts
          --runInBand

  frontend-build-check:
    name: Frontend TypeCheck, PWA Workbox Build & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        working-directory: client
        run: npm ci
      - name: Run npm audit (high/critical)
        working-directory: client
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: Build production SPA + Offline PWA Service Worker
        working-directory: client
        run: npm run build
